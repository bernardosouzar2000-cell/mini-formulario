<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulario 1</h1>

<form>


<!---Legenda para nome-->
    <label for="campo_nome">Nome:</label>

    <!--Campo input do type text-->
    <input id="campo_nome" type="text" placeholder="Digite seu nome aqui" required>

    <br><br>
<!---Legenda para email-->
    <label for="campo_email">Email:</label>

    <!--Campo input do type email-->
    <input id="campo_email" type="email" placeholder="Digite seu email aqui" required>

    <br><br>
<!---Legenda para senha-->
    <label for="campo_senha">Senha:</label>
    <!--Campo input do type password-->
    <input id="campo_senha" type="password" placeholder="Digite sua senha aqui" required>

    <br><br>
<h2> Animal de estimação</h2>

<input type="Radio" id="dog" name="animal" value="cachorro">
<label for="dog">Cachorro</label>

<br><br>

<input type="Radio" id="cat" name="animal" value="gato">
<label for="cat">Gato</label>

<br><br>

<input type="Radio" id="bird" name="animal" value="pássaro">
<label for="bird">Pássaro</label>

<br><br>

<input type="Radio" id="Nd" name="nada" value="Nenhum">
<label for="nd">Nenhum</label>

<br><br>
<h2>Você tem isso em casa ?</h2>

<input id="item1" type="checkbox" name="item1" value="tv">
<label for="item1">TV</label><br><br>

<input id="item2" type="checkbox" name="item2" value="geladeira">
<label for="item2">Geladeira</label><br><br>

<input id="item3" type="checkbox" name="item3" value="fogão">
<label for="item3">Fogão</label><br><br>


<h2>Escolha uma cor</h2>
<select name="cores">
<option selected disabled value="">selecione uma cor </option>
<option value="vermelho">vermelho</option>
<option value="azul">azul</option>
<option value="verde">verde</option>
<option value="amarelo">amarelo</option>

    </select>

<br><br>

<h2>Digite sua mensagem</h2>

<textarea name="Mensagem" placeholder="Digite sua mensagem aqui" rows="15" cols="55"></textarea>

 
    
<br><br>


<!-- Campo Input do tipo submit-->
<input type="submit" value="Enviar Formulario"><br><br>




</form>

<br><br>
 
<hr><br>
